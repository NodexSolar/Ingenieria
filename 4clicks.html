<style>
:root{
  --sol:#C8881A;--sol-lt:#E8A835;--sol-pale:#FDF3E0;--sol-border:rgba(200,136,26,.25);
  --forest:#152815;--forest2:#1B3219;
  --cream:#F6F1E9;--cream-dk:#EDE5D4;--cream-bg:#FAF8F4;
  --white:#FFFFFF;--text:#1A1A12;--muted:rgba(26,26,18,.58);--stone:#8A8878;
  --border-lt:rgba(26,26,18,.12);--wa:#1FA855;--nav-h:64px;
  color-scheme:light;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--cream-bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
@keyframes spin-cw{to{transform:rotate(360deg)}}
.logo-spin-slow{animation:spin-cw 120s linear infinite}

/* NAV (igual a la web) */
nav{position:sticky;top:0;height:calc(var(--nav-h) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding-inline:5%;background:rgba(250,248,244,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border-lt)}
.nav-logo{display:flex;align-items:center;gap:14px}
.nl-main{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--text);line-height:1;display:block}
.nl-sub{font-size:8px;font-weight:300;letter-spacing:.5em;text-transform:uppercase;color:var(--sol);line-height:1;display:block;margin-top:3px}
.stepcount{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone)}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:4px;background:var(--cream-bg)}
.progress span{background:var(--cream-dk);transition:background .3s}
.progress span.on{background:var(--sol)}
.progress.hide{visibility:hidden}

.wrap{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:22px calc(env(safe-area-inset-bottom,0px) + 32px)}
.screen{display:flex;flex-direction:column;gap:18px}
.screen.anim{animation:fade-up .4s ease both}
@keyframes fade-up{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--sol);display:flex;align-items:center;gap:14px}
.eyebrow::before{content:'';display:block;width:28px;height:1px;background:var(--sol);opacity:.7}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;line-height:.95;letter-spacing:-.02em;color:var(--text);text-wrap:balance}
h1{font-size:clamp(52px,15vw,70px)}
h2{font-size:clamp(42px,12vw,54px)}
h1 em,h2 em{font-style:italic;color:var(--sol)}
.back{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);display:inline-flex;gap:10px;align-items:center;padding:6px 0;align-self:flex-start}
.back::before{content:'';width:20px;height:1px;background:var(--stone)}

.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:62px;font-size:14px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--white);background:var(--forest);clip-path:polygon(14px 0%,100% 0%,calc(100% - 14px) 100%,0% 100%);transition:background .2s,transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.sol{background:var(--sol);color:var(--forest);font-size:16px}
.btn.wa{background:var(--wa)}
.ghost{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);padding:12px;align-self:center}
button:focus-visible,a:focus-visible{outline:2px solid var(--sol);outline-offset:3px}

/* HERO */
.hero{position:relative;margin-inline:-18px;margin-top:-22px;min-height:min(58vh,520px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--forest)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,40,21,0) 30%,rgba(21,40,21,.9) 100%)}
.hero-in{position:relative;z-index:1;padding:24px 20px 26px;display:flex;flex-direction:column;gap:14px}
.hero h1{color:var(--cream)}
.hero .eyebrow{color:var(--sol-lt)}
.hero .eyebrow::before{background:var(--sol-lt)}
.resi{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--white);border:1px solid var(--border-lt);font-size:15px;line-height:1.4}
.resi b{font-weight:600;color:var(--forest)}
.resi a{color:var(--sol);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

/* MAPA SVG */
.mapbox{position:relative;border:1px solid var(--border-lt);background:#DCE6E3;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox svg{display:block;width:100%;height:auto;aspect-ratio:1000/942;cursor:grab}
.mapbox svg:active{cursor:grabbing}
.pt{stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;transition:fill .15s}
.pt.in{fill:#F1DFB4}
.pt.out{fill:#E9E5DC}
.pt.sel{fill:var(--sol)}
.lbl{font-family:'DM Sans',sans-serif;font-weight:600;fill:var(--forest);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:3px;stroke-linejoin:round}
.lbl.out{fill:var(--stone);font-weight:400}
.lbl.sel{fill:#fff;stroke:rgba(150,95,10,.6)}
.river{font-family:'Cormorant Garamond',serif;font-style:italic;fill:#7E9A94;text-anchor:middle;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;background:var(--white);border:1px solid var(--border-lt);font-size:24px;line-height:1;color:var(--forest)}
.zoneinfo{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--sol-pale);border-left:3px solid var(--sol);min-height:64px;justify-content:center}
.zoneinfo b{font-size:20px;font-weight:500;color:var(--forest)}
.zoneinfo span{font-size:14px;color:var(--muted)}
.zoneinfo.empty{background:transparent;border-left-color:var(--border-lt)}
.zoneinfo.out{background:#F7EFE6;border-left-color:var(--stone)}
.mini{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:1px solid var(--border-lt);background:var(--white);font-size:15px;color:var(--forest);padding:8px}
.mini.sel{border-color:var(--sol);background:var(--sol-pale)}

/* OPCIONES */
.opts{display:grid;gap:10px}
.opts.cols2{grid-template-columns:1fr 1fr}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--white);border:1.5px solid var(--border-lt);padding:16px;display:flex;align-items:center;gap:14px;text-align:left;min-height:72px;transition:border-color .15s,background .15s,transform .1s;position:relative}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--sol);background:var(--sol-pale)}
.opt.sel::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 20px 20px 0;border-color:transparent var(--sol) transparent transparent}
.opt .ic{flex:none;width:56px;height:48px;display:grid;place-items:center}
.opt .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .t b{font-size:19px;font-weight:500;color:var(--forest);line-height:1.2}
.opt .t span{font-size:14px;color:var(--muted);line-height:1.3}
.opt.stack{flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 8px}
.opt.stack .t{align-items:center}
.people{display:flex;gap:2px;height:30px;align-items:flex-end}
.glabel{font-size:15px;font-weight:500;color:var(--forest);margin-top:6px}
.glabel small{font-weight:400;color:var(--stone);font-size:13px}
.reveal{display:flex;flex-direction:column;gap:10px;animation:fade-up .35s ease both}
.note{font-size:13px;color:var(--stone);line-height:1.5}

/* SLIDER factura */
.bill{background:var(--white);border:1.5px solid var(--border-lt);padding:16px;display:flex;flex-direction:column;gap:10px}
.bill.on{border-color:var(--sol)}
.billval{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:500;color:var(--stone);line-height:1}
.bill.on .billval{color:var(--forest)}
.bill input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent}
.bill input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,var(--sol) var(--p,0%),var(--cream-dk) var(--p,0%))}
.bill input[type=range]::-moz-range-track{height:6px;background:var(--cream-dk)}
.bill input[type=range]::-moz-range-progress{height:6px;background:var(--sol)}
.bill input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-13px;border-radius:50%;background:var(--forest);border:4px solid var(--sol-lt)}
.bill input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--forest);border:4px solid var(--sol-lt)}
.billscale{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:11px;color:var(--stone)}
.billclear{font-size:12px;color:var(--stone);text-decoration:underline;align-self:flex-end}

/* RESULTADO */
.phasebox{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--sol-pale);border:2px solid var(--sol)}
.phasebox .glabel{margin:0;font-size:17px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:58px;font-size:17px;font-weight:500;color:var(--forest);background:var(--white);border:1.5px solid var(--border-lt)}
.seg button.on{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.result{background:var(--forest);color:var(--cream);padding:24px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.result .eyebrow{color:var(--sol-lt)}
.result .eyebrow::before{background:var(--sol-lt)}
.sys{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400;line-height:1.05;color:var(--cream)}
.pricebig{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,9vw,48px);line-height:1;color:var(--sol-lt);white-space:nowrap;font-variant-numeric:tabular-nums}
.pricebig small{display:block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:13px;letter-spacing:.06em;color:rgba(246,241,233,.7);margin-top:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid rgba(246,241,233,.15);padding-top:16px}
.facts div{display:flex;flex-direction:column;gap:3px}
.facts b{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--cream)}
.facts span{font-size:13px;color:rgba(246,241,233,.68);line-height:1.3}
.incl{display:flex;flex-direction:column;gap:10px;font-size:16px;font-weight:300}
.incl li{list-style:none;display:flex;gap:12px;align-items:flex-start;line-height:1.4}
.incl li::before{content:'';flex:none;width:8px;height:8px;margin-top:7px;background:var(--sol);transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===== Cálculo ===== */
function kwhFromBill(b){return Math.max(150,(b/1.3-15000)/175);}  // factura mensual con impuestos → kWh/mes
function consumo(){const base=PEOPLE[S.people][S.energy];return S.bill?kwhFromBill(S.bill):base;}
function sizePanels(kwh){let n=Math.round(kwh*0.9/KWH_PANEL/3)*3;return Math.min(15,Math.max(6,n));}
function quote(fase){
  const kwh=consumo(), n=sizePanels(kwh), kwp=n*575/1000, mods=Math.ceil(n/3);
  const tipo=S.goal==="respaldo"?"HIB":"ON", bat=tipo==="HIB"?CUTS[S.cut].bat:0;
  const inv=INV[tipo+"_"+fase].find(([l])=>kwp<=l);
  let mo=n<=6?P.mo6:n<=12?P.mo12:P.mo12+P.moExtra*Math.ceil((n-12)/3); mo+=P.moExtra*Math.max(0,bat-1);
  const tramite=tipo==="ON"&&S.ug==="si";
  const cost=n*P.panel+mods*P.est[S.roof]+P.fij[S.roof]+inv[2]+(tipo==="ON"?P.limitador[fase]:0)+bat*P.bat+P.cable+P.tablero[fase]+mo+P.transp*S.loc.transp+(tramite?P.tramite:0);
  const mid=cost*P.factor, lo=Math.floor(mid*.95/100)*100, hi=Math.ceil(mid*1.10/100)*100;
  const hours=bat?Math.round(bat*5.12*0.9/BACKUP_KW):0;
  return {kwh,n,kwp,tipo,bat,inv:inv[1],lo,hi,tramite,gen:Math.round(n*KWH_PANEL),hours};
}

const back=()=>`<button class="back" data-back type="button">Volver</button>`;
function opt(group,val,icon,title,desc,extra){return `<button type="button" class="opt ${extra||""}${S[group]===val?" sel":""}" data-group="${group}" data-val="${val}">${icon?`<span class="ic">${icon}</span>`:""}<span class="t"><b>${title}</b>${desc?`<span>${desc}</span>`:""}</span></button>`;}
const asesorLink=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent("Hola Nodex! Quiero cotizar un proyecto comercial / industrial.")}`;

function render(){
  setTop();
  let h="";
  if(S.step===0){
    h=`<section class="screen">
      <div class="hero">
        <img src="cada-techo-nodo-solar.webp" alt="Casa con paneles solares instalados por Nodex Solar" fetchpriority="high">
        <div class="hero-in">
          <span class="eyebrow">Cotización en 4 clicks</span>
          <h1>Coticemos en <em>un minuto.</em></h1>
        </div>
      </div>
      <button class="btn sol" type="button" data-next="1">Comenzar ${ICON.sun}</button>
      <div class="resi">${ICON.home}<div><b>Solo para casas.</b> ¿Comercio o industria? <a href="${asesorLink}" target="_blank" rel="noopener" data-asesor>Hablá con un asesor</a></div></div>
    </section>`;
  }
  else if(S.step===1){
    h=`<section class="screen">${back()}
      <h2>¿Dónde está <em>tu casa?</em></h2>
      <span class="glabel">Tocá tu zona · usá + para acercar</span>
      <div class="mapbox" id="mapbox">${mapSVG()}<div class="zoom"><button type="button" data-zoom="1.6" aria-label="Acercar">+</button><button type="button" data-zoom="0.625" aria-label="Alejar">−</button></div></div>
      <div class="zoneinfo${S.loc?(S.loc.inside?"":" out"):" empty"}" id="zoneinfo">${zoneHTML()}</div>
      <button type="button" class="mini${S.loc&&S.loc.other?" sel":""}" data-other>Estoy en otro lugar</button>
      <button class="btn" type="button" data-next="2" ${S.loc?"":"disabled"}>Siguiente</button>
    </section>`;
  }
  else if(S.step===2){
    h=`<section class="screen">${back()}
      <h2>¿Qué techo <em>tenés?</em></h2>
      <div class="opts cols2">
        ${opt("roof","chapa",ICON.chapa,"Chapa","","stack")}
        ${opt("roof","teja",ICON.teja,"Teja","","stack")}
        ${opt("roof","losa",ICON.losa,"Losa","","stack")}
        ${opt("roof","nose",ICON.nose,"No sé","","stack")}
      </div>
    </section>`;
  }
  else if(S.step===3){
    const b=S.bill, pct=b?((b-BILL_MIN)/(BILL_MAX-BILL_MIN)*100):0;
    h=`<section class="screen">${back()}
      <h2>¿Cómo es <em>tu casa?</em></h2>
      <span class="glabel">¿Cuántos viven?</span>
      <div class="opts cols3">
        ${opt("people","p12",personIcons("p12"),"1 a 2","","stack")}
        ${opt("people","p34",personIcons("p34"),"3 a 4","","stack")}
        ${opt("people","p5",personIcons("p5"),"5 o más","","stack")}
      </div>
      <div class="opts cols2">
        ${opt("energy","gas",ICON.gas,"Con gas","","stack")}
        ${opt("energy","elec",ICON.elec,"Todo eléctrico","","stack")}
      </div>
      <span class="glabel">¿Cuánto pagaste en tus últimas facturas? <small>(opcional)</small></span>
      <div class="bill${b?" on":""}" id="bill">
        <div class="billval" id="billval">${b?ars(b)+(b>=BILL_MAX?" o más":""):"Deslizá →"}</div>
        <input type="range" id="billr" min="${BILL_MIN}" max="${BILL_MAX}" step="${BILL_STEP}" value="${b||BILL_MIN}" style="--p:${pct}%" aria-label="Monto de la factura de luz por mes">
        <div class="billscale"><span>$40.000</span><span>$600.000</span></div>
        ${b?`<button type="button" class="billclear" data-billclear>No sé, borrar</button>`:""}
      </div>
      <button class="btn" type="button" data-next="4" ${S.people&&S.energy?"":"disabled"}>Siguiente</button>
    </section>`;
  }
  else if(S.step===4){
    let sub="";
    if(S.goal==="respaldo") sub=`<div class="reveal"><span class="glabel">¿Se te corta la luz?</span><div class="opts">
        ${opt("cut","nunca",ICON.bat(1),"Nunca","1 batería")}${opt("cut","aveces",ICON.bat(2),"A veces","2 baterías")}${opt("cut","seguido",ICON.bat(3),"Seguido","3 baterías")}</div></div>`;
    if(S.goal==="ahorro") sub=`<div class="reveal"><span class="glabel">¿Vender el excedente a la red?</span><div class="opts">
        ${opt("ug","si","","Sí, tengo Edenor o Edesur","Quiero vender lo que sobra")}${opt("ug","no","","No, gracias","")}${opt("ug","nopermite","","Mi distribuidora no lo permite","Cooperativa u otra empresa")}</div></div>`;
    h=`<section class="screen">${back()}
      <h2>¿Qué <em>buscás?</em></h2>
      <div class="opts cols2">
        ${opt("goal","ahorro",ICON.ahorro,"Ahorrar","","stack")}
        ${opt("goal","respaldo",ICON.bat(2),"Respaldo","con baterías","stack")}
      </div>
      ${sub}
    </section>`;
  }
  else if(S.step===5){
    h=resultHTML();
    track("cotizador_resultado",{partido:S.loc.name,techo:S.roof,personas:S.people,energia:S.energy,factura:S.bill||0,objetivo:S.goal});
  }
  view.innerHTML=h;
  if(lastStep!==S.step){const sc=view.querySelector(".screen");if(sc)sc.classList.add("anim");lastStep=S.step;}
  if(S.step===1) initMap();
  const wa=document.getElementById("wa");
  if(wa) wa.addEventListener("click",()=>track("cotizador_whatsapp",{partido:S.loc.name,fase:S.fase,objetivo:S.goal}));
}

function zoneHTML(){
  const L=S.loc;
  if(!L) return `<span>Tocá tu partido en el mapa</span>`;
  if(L.other) return `<b>Otro lugar</b><span>Traslado a coordinar</span>`;
  return `<b>${L.name}</b><span>${L.inside?(L.km<=6?"¡Estamos al lado!":`A ${L.km} km de Nodex`):"Fuera de zona · traslado aparte"}</span>`;
}

function resultHTML(){
  const q=quote(S.fase);
  const incl=[`${q.n} paneles de 575 W`,q.inv,q.bat?`${q.bat} batería${q.bat>1?"s":""} de litio de 5 kWh`:null,
    q.tramite?"Gestión del trámite de Usuario Generador":null,"Estructura, tablero y cableado","Instalación completa"].filter(Boolean);
  return `<section class="screen">${back()}
    <h2>Tu <em>estimado</em></h2>
    <div class="phasebox"><span class="glabel">Elegí tu servicio de luz</span>
      <div class="seg" role="group" aria-label="Tipo de servicio"><button type="button" data-fase="mono" class="${S.fase==="mono"?"on":""}" aria-pressed="${S.fase==="mono"}">Monofásico</button><button type="button" data-fase="tri" class="${S.fase==="tri"?"on":""}" aria-pressed="${S.fase==="tri"}">Trifásico</button></div>
      <span class="note">En el medidor: 2 cables = monofásico · 4 cables = trifásico</span>
    </div>
    <div class="result">
      <span class="eyebrow">${q.tipo==="ON"?"Sistema para ahorrar":"Sistema con respaldo"}</span>
      <div class="sys">${q.n} paneles · ${kwpTxt(q.kwp)} kWp</div>
      <div class="pricebig" id="price">${usd(q.lo)} – ${q.hi.toLocaleString("es-AR")}<small>Llave en mano · estimado</small></div>
      <div class="facts">
        <div><b>${q.gen} kWh</b><span>generación por mes</span></div>
        <div><b>${q.hours?"~"+q.hours+" h":"—"}</b><span>${q.hours?"de respaldo (heladera, luces, wifi)":"sin baterías"}</span></div>
      </div>
    </div>
    <ul class="incl">${incl.map(i=>`<li>${i}</li>`).join("")}</ul>
    <a class="btn wa" id="wa" href="${waLink(q)}" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.4.4 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg>
      Enviar por WhatsApp</a>
    <p class="note">Precio estimado en dólares. Lo confirmamos con tu factura y fotos del techo.${q.tramite?" Los costos de la distribuidora van aparte.":""}${S.loc.inside?"":" Traslado fuera de zona aparte."}</p>
    <button class="ghost" type="button" data-restart>Empezar de nuevo</button>
  </section>`;
}
function waLink(q){
  const L=S.loc;
  const ref="COT-"+[S.roof,S.people,S.energy,S.goal,S.fase].map(x=>x.slice(0,2).toUpperCase()).join("");
  const lugar=L.other?"Otro lugar (fuera de AMBA)":`${L.name}${L.inside?"":" (fuera de zona)"}`;
  const obj=S.goal==="respaldo"?`Respaldo con ${q.bat} batería${q.bat>1?"s":""} (cortes: ${CUTS[S.cut].label.toLowerCase()})`:`Ahorrar (${UG[S.ug].toLowerCase()})`;
  const txt=`Hola Nodex! Hice la cotización en 4 clicks:\n\n`+
    `- Lugar: ${lugar}\n- Techo: ${ROOFS[S.roof]}\n- Casa: ${PEOPLE[S.people].label} personas, ${S.energy==="gas"?"con gas":"todo eléctrico"}`+
    (S.bill?`\n- Factura: ${ars(S.bill)}${S.bill>=BILL_MAX?" o más":""} por mes`:"")+
    `\n- Busco: ${obj}\n- Servicio: ${S.fase==="mono"?"monofásico":"trifásico"}\n\n`+
    `Me salió: ${q.n} paneles (${kwpTxt(q.kwp)} kWp), entre ${usd(q.lo)} y ${usd(q.hi)}.\n\n¿Me arman el presupuesto exacto? (${ref})`;
  return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(txt)}`;
}

/* ===== Mapa propio (SVG de partidos, sin APIs) ===== */
let vb=null, svgEl=null;
function proj(lat,lon){ // misma proyección que el mapa generado
  const W0=-59.32,S1=-33.98,kx=Math.cos(-34.55*Math.PI/180),scale=MAP.vw/((-57.98-W0)*kx);
  return [(lon-W0)*kx*scale,(S1-lat)*scale];
}
function mapSVG(){
  const [rx,ry]=proj(-34.50,-58.27);
  let paths="",labels="";
  MAP.parts.forEach((p,i)=>{
    const sel=S.loc&&!S.loc.other&&S.loc.i===i;
    paths+=`<path class="pt ${p.zone?"in":"out"}${sel?" sel":""}" data-i="${i}" d="${p.d}"/>`;
    labels+=`<text class="lbl${p.zone?"":" out"}${sel?" sel":""}" data-li="${i}" x="${p.lx}" y="${p.ly}">${p.name}</text>`;
  });
  const [mx,my]=MAP.munro;
  return `<svg id="msvg" viewBox="0 0 ${MAP.vw} ${MAP.vh}" role="application" aria-label="Mapa de CABA y Gran Buenos Aires por partido">
    <text class="river" x="${rx.toFixed(0)}" y="${ry.toFixed(0)}" font-size="30">Río de la Plata</text>
    <g id="parts">${paths}</g><g id="labels">${labels}</g>
    <g id="nodex" transform="translate(${mx},${my})" style="pointer-events:none">
      <circle r="26" fill="#C8881A" opacity=".18"/>
      <polygon points="0,-17 15,-8.5 15,8.5 0,17 -15,8.5 -15,-8.5" fill="#152815" stroke="#E8A835" stroke-width="3"/>
      <circle r="5" fill="#E8A835"/>
    </g>
  </svg>`;
}
function initMap(){
  svgEl=document.getElementById("msvg"); if(!svgEl) return;
  if(!vb){vb={x:0,y:0,w:MAP.vw,h:MAP.vh};}
  applyVB();
  const box=document.getElementById("mapbox"), pts=new Map(); let start=null, moved=false, pinch0=null;
  const toVB=(cx,cy)=>{const r=svgEl.getBoundingClientRect();return [vb.x+(cx-r.left)/r.width*vb.w, vb.y+(cy-r.top)/r.height*vb.h];};
  svgEl.addEventListener("pointerdown",e=>{svgEl.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=false;start={x:e.clientX,y:e.clientY,vb:{...vb}};if(pts.size===2){const a=[...pts.values()];pinch0={d:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),vb:{...vb},c:toVB((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2)};}});
  svgEl.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    const r=svgEl.getBoundingClientRect();
    if(pts.size===2&&pinch0){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);zoomAt(pinch0.c,pinch0.vb,pinch0.d/d);moved=true;return;}
    const dx=e.clientX-start.x, dy=e.clientY-start.y;
    if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
    if(moved){vb.x=start.vb.x-dx/r.width*vb.w; vb.y=start.vb.y-dy/r.height*vb.h; clampVB(); applyVB();}
  });
  const end=e=>{
    const wasTap=!moved&&pts.size===1; pts.delete(e.pointerId); if(pts.size<2) pinch0=null;
    if(wasTap){const t=document.elementFromPoint(e.clientX,e.clientY);const pth=t&&t.closest&&t.closest("[data-i]");if(pth) pick(+pth.dataset.i);}
    if(pts.size===1){const v=[...pts.values()][0];start={x:v[0],y:v[1],vb:{...vb}};}
  };
  svgEl.addEventListener("pointerup",end); svgEl.addEventListener("pointercancel",e=>{pts.delete(e.pointerId);pinch0=null;});
  box.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>zoomAt([vb.x+vb.w/2,vb.y+vb.h/2],{...vb},1/+b.dataset.zoom)));
}
function zoomAt(c,base,f){ // f>1 aleja, f<1 acerca
  let w=Math.min(MAP.vw,Math.max(MAP.vw/7,base.w*f)); const k=w/base.w, h=base.h*k;
  vb={x:c[0]-(c[0]-base.x)*k, y:c[1]-(c[1]-base.y)*k, w, h}; clampVB(); applyVB();
}
function clampVB(){vb.x=Math.min(Math.max(vb.x,0),MAP.vw-vb.w);vb.y=Math.min(Math.max(vb.y,0),MAP.vh-vb.h);}
function applyVB(){
  if(!svgEl)return;
  svgEl.setAttribute("viewBox",`${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
  const r=svgEl.getBoundingClientRect(), u=vb.w/(r.width||360); // unidades por pixel
  const fs=12.5*u, minA=(fs*fs)*9;
  const shown=[], selI=S.loc&&!S.loc.other?S.loc.i:-1;
  [...svgEl.querySelectorAll(".lbl")].sort((a,b)=>(+b.dataset.li===selI)-(+a.dataset.li===selI)||MAP.parts[+b.dataset.li].a-MAP.parts[+a.dataset.li].a).forEach(t=>{
    const i=+t.dataset.li,p=MAP.parts[i]; t.setAttribute("font-size",fs.toFixed(1)); t.style.display="";
    if(i!==selI&&p.a<minA){t.style.display="none";return;}
    const bb=t.getBBox(), pad=2*u, r2={x:bb.x-pad,y:bb.y-pad,w:bb.width+2*pad,h:bb.height+2*pad};
    const mxn=MAP.munro; const hitNodex=Math.abs(p.lx-mxn[0])<(bb.width/2+20*u)&&Math.abs(p.ly-mxn[1])<(bb.height/2+18*u);
    if(i!==selI&&(hitNodex||shown.some(q=>r2.x<q.x+q.w&&q.x<r2.x+r2.w&&r2.y<q.y+q.h&&q.y<r2.y+r2.h))){t.style.display="none";return;}
    shown.push(r2);
  });
  const nd=svgEl.querySelector("#nodex"); if(nd) nd.setAttribute("transform",`translate(${MAP.munro[0]},${MAP.munro[1]}) scale(${(u*1.1).toFixed(3)})`);
  svgEl.querySelector(".river").setAttribute("font-size",(18*u).toFixed(1));
}
function pick(i){
  const p=MAP.parts[i]; const km=p.km;
  let transp=!p.zone?1.5:km<=12?.5:km<=30?1:km<=50?1.25:1.5;
  S.loc={i,name:p.name,km,inside:p.zone,transp};
  svgEl.querySelectorAll(".pt.sel,.lbl.sel").forEach(x=>x.classList.remove("sel"));
  svgEl.querySelector(`[data-i="${i}"]`).classList.add("sel");
  const lb=svgEl.querySelector(`[data-li="${i}"]`); lb.classList.add("sel");
  if(p.a<6000&&vb.w>MAP.vw/1.6){const pth=svgEl.querySelector('[data-i="'+i+'"]').getBBox();zoomAt([pth.x+pth.width/2,pth.y+pth.height/2],{...vb},0.45);}
  applyVB(); refreshLoc(); track("cotizador_ubicacion",{partido:p.name,dentro:p.zone});
}
function refreshLoc(){
  const z=document.getElementById("zoneinfo"); if(!z) return;
  z.className="zoneinfo"+(S.loc?(S.loc.inside?"":" out"):" empty"); z.innerHTML=zoneHTML();
  view.querySelector("[data-next='2']").disabled=!S.loc;
  view.querySelector("[data-other]").classList.toggle("sel",!!(S.loc&&S.loc.other));
}

/* ===== Eventos ===== */
view.addEventListener("input",e=>{
  if(e.target.id!=="billr")return;
  S.bill=+e.target.value; const pct=(S.bill-BILL_MIN)/(BILL_MAX-BILL_MIN)*100;
  e.target.style.setProperty("--p",pct+"%");
  document.getElementById("billval").textContent=ars(S.bill)+(S.bill>=BILL_MAX?" o más":"");
  const b=document.getElementById("bill"); if(!b.classList.contains("on")){b.classList.add("on");b.insertAdjacentHTML("beforeend",`<button type="button" class="billclear" data-billclear>No sé, borrar</button>`);}
});
view.addEventListener("click",e=>{
  const f=e.target.closest("[data-fase]");
  if(f){S.fase=f.dataset.fase;const y=window.scrollY;render();window.scrollTo(0,y);track("cotizador_fase",{fase:S.fase});return;}
  if(e.target.closest("[data-billclear]")){S.bill=null;render();return;}
  if(e.target.closest("[data-asesor]")){track("cotizador_asesor_comercial");return;}
  const o=e.target.closest("[data-group]");
  if(o){
    const g=o.dataset.group; S[g]=o.dataset.val;
    if(g==="goal"){S.cut=null;S.ug=null;}
    if(g==="roof"){render();setTimeout(()=>go(3),220);return;}
    if(g==="cut"||g==="ug"){render();setTimeout(()=>go(5),260);return;}
    const y=window.scrollY; render(); window.scrollTo(0,y);
    if(g==="goal"){const r=view.querySelector(".reveal");if(r)r.scrollIntoView({behavior:"smooth",block:"center"});}
    return;
  }
  if(e.target.closest("[data-other]")){S.loc={other:true,inside:false,km:null,transp:1.5,name:"Otro lugar"};if(svgEl)svgEl.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));refreshLoc();return;}
  const n=e.target.closest("[data-next]");
  if(n&&!n.disabled){if(S.step===0)track("cotizador_inicio");go(+n.dataset.next);return;}
  if(e.target.closest("[data-back]")){go(Math.max(0,S.step-1));return;}
  if(e.target.closest("[data-restart]")){Object.assign(S,{loc:null,roof:null,people:null,energy:null,bill:null,goal:null,cut:null,ug:null,fase:"mono"});vb=null;go(0);}
});
window.addEventListener("resize",()=>{if(S.step===1)applyVB();});
render();
</script>
